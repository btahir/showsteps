  <title>Scaled cross-origin frame – Acme Books edge</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">

<body>
  <!-- E7d variant: a cross-origin iframe drawn at scale(0.5) with a border (placement through the handshake). -->
  <main>
    <h1>Scaled cross-origin frame</h1>
    <div style="height:260px">
      <iframe id="scaled-x" title="Scaled widget" src="http://localhost:4517/edge/frame-inner.html" style="width:800px;height:480px;border:6px solid #1f6f5c;border-radius:0;transform:scale(0.5);transform-origin:0 0"></iframe>
    </div>
  </main>
</body>

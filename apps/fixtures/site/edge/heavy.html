<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger – Acme Books edge</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    #ledger p { margin: 0; font: 12px/1.3 ui-monospace, Menlo, monospace; }
    #ledger span { margin-right: 6px; }
  </style>
</head>
<body>
  <!-- R9: 50,000 text nodes that all pass the cheap secret pre-filter (card-shaped, Luhn-failing
       reference numbers, so none is a real match). The redaction scan must stop at its budget,
       report `incomplete`, and the step still gets its screenshot and a "check redactions" chip. -->
  <main>
    <h1>Ledger</h1>
    <button id="heavy-button" class="btn primary" type="button">Reconcile</button>
    <p id="status" role="status"></p>
    <div id="ledger"></div>
  </main>
  <script>
    const ledger = document.getElementById("ledger");
    const frag = document.createDocumentFragment();
    for (let row = 0; row < 5000; row++) {
      const p = document.createElement("p");
      for (let col = 0; col < 10; col++) {
        const s = document.createElement("span");
        const n = String(row * 10 + col).padStart(6, "0");
        // 16 digits in 4-4-4-4 groups starting with 4: card-shaped; the last digit is chosen so Luhn fails.
        const digits = "4000" + n + "12345";
        let sum = 0;
        for (let i = digits.length - 1, dbl = true; i >= 0; i--, dbl = !dbl) { let d = +digits[i]; if (dbl) { d *= 2; if (d > 9) d -= 9; } sum += d; }
        const check = (10 - (sum % 10) + 1) % 10; // one off the valid check digit
        const all = digits + check;
        s.textContent = `Ref ${all.slice(0, 4)} ${all.slice(4, 8)} ${all.slice(8, 12)} ${all.slice(12)}`;
        p.append(s);
      }
      frag.append(p);
    }
    ledger.append(frag);
    document.getElementById("heavy-button").addEventListener("click", () => { document.getElementById("status").textContent = "Reconciled"; });
  </script>
</body>
</html>
